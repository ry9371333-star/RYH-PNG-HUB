
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RYH PNG HUB</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101426;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:30px 15px;background:linear-gradient(135deg,#512da8,#171c3c)}
h1{font-size:32px}
.search{display:flex;gap:8px;max-width:650px;margin:20px auto}
input{flex:1;min-width:0;padding:14px;border:0;border-radius:9px;font-size:16px}
button{padding:12px 16px;border:0;border-radius:9px;background:#8b5cf6;color:white;font-weight:bold;cursor:pointer}
main{max-width:1100px;margin:auto;padding:15px}
.categories{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
.categories button{background:#252d49}
.categories button.active{background:#8b5cf6}
#status{color:#ddd;margin:15px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.card{background:#202943;border-radius:12px;overflow:hidden}
.preview{height:170px;background:#eee;display:grid;place-items:center}
.preview img{max-width:100%;max-height:100%;object-fit:contain}
.info{padding:10px}
.name{font-size:14px;margin-bottom:8px}
.meta{font-size:11px;color:#bbb;margin-bottom:9px}
a{display:inline-block;text-decoration:none;color:white;background:#6844ce;padding:8px;border-radius:7px;font-size:12px;margin:2px}
#more{display:block;margin:25px auto}
footer{text-align:center;color:#aaa;padding:25px}
@media(max-width:500px){
.search{flex-direction:column}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.preview{height:140px}
}
</style>
</head>
<body>

<header>
<h1>🖼️ RYH PNG HUB</h1>
<p>Search All Images Free</p>
<form class="search" id="form">
<input id="q" placeholder="Search PNG, JPG, Gaming, Cut..." required>
<button>SEARCH</button>
</form>
</header>

<main>
<h2>Categories</h2>
<div class="categories" id="categories">
<button class="active" data-q="nature">Nature</button>
<button data-q="transparent png">PNG</button>
<button data-q="red scratch effect">Cut PNG</button>
<button data-q="red scratch texture">Red Scratch</button>
<button data-q="gaming">Gaming</button>
<button data-q="youtube logo">YouTube</button>
<button data-q="flowers">Flowers</button>
<button data-q="cartoon">Cartoon</button>
<button data-q="cars">Cars</button>
<button data-q="fire effects">Fire</button>
<button data-q="crack texture">Crack</button>
<button data-q="festival">Festival</button>
</div>

<div id="status">अपनी पसंद की इमेज खोजें।</div>
<div class="grid" id="results"></div>
<button id="more" hidden>और इमेज दिखाओ</button>
</main>

<footer>© 2026 RYH PNG HUB</footer>

<script>
const form=document.getElementById("form");
const input=document.getElementById("q");
const results=document.getElementById("results");
const statusBox=document.getElementById("status");
const more=document.getElementById("more");

let current="";
let page=1;
let busy=false;
let pageCount=1;

async function searchImages(term,append=false){
 if(busy)return;

 if(!append){
  current=term;
  page=1;
  results.innerHTML="";
  more.hidden=true;
 }

 busy=true;
 statusBox.textContent="इमेज खोजी जा रही हैं...";

 try{
  const params=new URLSearchParams({
   q:current,
   page:String(page),
   page_size:"20",
   mature:"false",
   filter_dead:"true"
  });

  const response=await fetch(
   "https://api.openverse.org/v1/images/?"+params
  );

  if(!response.ok)throw new Error("HTTP "+response.status);

  const data=await response.json();
  pageCount=data.page_count||1;

  if(!data.results || data.results.length===0){
   statusBox.textContent="कोई इमेज नहीं मिली। दूसरा शब्द खोजें।";
   more.hidden=true;
   return;
  }

  data.results.forEach(item=>{
   const card=document.createElement("div");
   card.className="card";

   const preview=document.createElement("div");
   preview.className="preview";

   const img=document.createElement("img");
   img.loading="lazy";
   img.src=item.thumbnail || item.url;
   img.alt=item.title || "Image";
   preview.appendChild(img);

   const info=document.createElement("div");
   info.className="info";

   const name=document.createElement("div");
   name.className="name";
   name.textContent=item.title || "Image";

   const meta=document.createElement("div");
   meta.className="meta";
   meta.textContent=
    "Format: "+(item.filetype||"Image")+
    " | License: "+(item.license||"Check source");

   const open=document.createElement("a");
   open.href=item.url;
   open.target="_blank";
   open.rel="noopener";
   open.textContent="Open Image";

   const download=document.createElement("a");
   download.href=item.url;
   download.target="_blank";
   download.rel="noopener";
   download.textContent="Download";

   const source=document.createElement("a");
   source.href=item.foreign_landing_url;
   source.target="_blank";
   source.rel="noopener";
   source.textContent="Source / License";

   info.append(name,meta,open,download,source);
   card.append(preview,info);
   results.appendChild(card);
  });

  statusBox.textContent=
   results.children.length+" images दिखाई गईं।";

  more.hidden=page>=pageCount;

 }catch(error){
  statusBox.textContent=
   "सर्च सेवा अभी उपलब्ध नहीं है। थोड़ी देर बाद दोबारा कोशिश करें।";
  more.hidden=true;
 }finally{
  busy=false;
 }
}

form.addEventListener("submit",e=>{
 e.preventDefault();
 document.querySelectorAll(".categories button")
 .forEach(b=>b.classList.remove("active"));
 searchImages(input.value.trim());
});

document.getElementById("categories").addEventListener("click",e=>{
 const btn=e.target.closest("button[data-q]");
 if(!btn)return;

 document.querySelectorAll(".categories button")
 .forEach(b=>b.classList.remove("active"));

 btn.classList.add("active");
 input.value=btn.dataset.q;
 searchImages(btn.dataset.q);
});

more.addEventListener("click",()=>{
 if(page<pageCount){
  page++;
  searchImages(current,true);
 }
});
</script>
</body>
</html>
