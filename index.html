
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RYH PNG HUB</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101426;color:white;font-family:Arial}
header{text-align:center;padding:30px 15px;background:linear-gradient(130deg,#592db5,#171c3c)}
h1{margin:0;font-size:32px}
header p{color:#ddd}
.search{display:flex;gap:8px;max-width:650px;margin:20px auto}
input{flex:1;min-width:0;padding:14px;border:0;border-radius:9px;font-size:16px}
button{padding:12px 16px;border:0;border-radius:9px;background:#8b5cf6;color:white;font-weight:bold;cursor:pointer}
main{max-width:1100px;margin:auto;padding:18px}
.categories{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.categories button{background:#28314c}
.categories button.active{background:#8b5cf6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{background:#202943;border-radius:12px;overflow:hidden}
.card img{width:100%;height:165px;object-fit:cover;background:#ddd}
.info{padding:10px}
.name{font-size:14px;margin-bottom:10px}
a{display:inline-block;background:#6844ce;color:white;text-decoration:none;padding:8px;border-radius:7px;font-size:12px}
#status{color:#ddd;margin:15px 0}
@media(max-width:500px){
.search{flex-direction:column}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<header>
<h1>🖼️ RYH PNG HUB</h1>
<p>Search Images Online</p>
<form class="search" id="form">
<input id="query" placeholder="Search images..." required>
<button>SEARCH</button>
</form>
</header>

<main>
<h2>Categories</h2>
<div class="categories" id="categories">
<button class="active" data-q="nature">Nature</button>
<button data-q="gaming">Gaming</button>
<button data-q="flowers">Flowers</button>
<button data-q="cars">Cars</button>
<button data-q="cartoon">Cartoon</button>
<button data-q="technology">Technology</button>
<button data-q="red scratch">Cut Effect</button>
<button data-q="fire">Fire</button>
<button data-q="animals">Animals</button>
<button data-q="city">City</button>
</div>

<div id="status">इमेज लोड हो रही हैं...</div>
<div class="grid" id="results"></div>
</main>

<script>
const results=document.getElementById("results");
const statusBox=document.getElementById("status");
const query=document.getElementById("query");

function showImages(term){
 results.innerHTML="";
 statusBox.textContent="इमेज लोड हो रही हैं...";

 for(let i=1;i<=24;i++){
  const card=document.createElement("div");
  card.className="card";

  const img=document.createElement("img");
  img.loading="lazy";
  img.alt=term+" image";
  img.src="https://loremflickr.com/500/400/"+encodeURIComponent(term)+"?lock="+(i+100);

  img.onerror=()=>{
   img.alt="Image unavailable";
   img.style.background="#444";
  };

  const info=document.createElement("div");
  info.className="info";

  const name=document.createElement("div");
  name.className="name";
  name.textContent=term+" image "+i;

  const link=document.createElement("a");
  link.href=img.src;
  link.target="_blank";
  link.rel="noopener";
  link.textContent="Open Image";

  info.append(name,link);
  card.append(img,info);
  results.append(card);
 }

 statusBox.textContent="आपकी इमेज लोड हो रही हैं।";
}

document.getElementById("form").addEventListener("submit",e=>{
 e.preventDefault();
 document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
 showImages(query.value.trim());
});

document.getElementById("categories").addEventListener("click",e=>{
 const btn=e.target.closest("button[data-q]");
 if(!btn)return;
 document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 query.value=btn.dataset.q;
 showImages(btn.dataset.q);
});

showImages("nature");
</script>
</body>
</html>
