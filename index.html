
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYH PNG HUB</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101426;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:30px 15px;background:linear-gradient(135deg,#512da8,#171c3c)}
h1{font-size:32px;margin:5px}
header p{color:#ddd}
.search{display:flex;max-width:650px;margin:20px auto;gap:8px}
input{flex:1;min-width:0;padding:14px;border:0;border-radius:9px;font-size:16px}
button{padding:12px 17px;border:0;border-radius:9px;background:#8b5cf6;color:white;font-weight:bold;cursor:pointer}
main{max-width:1100px;margin:auto;padding:15px}
.categories{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 22px}
.categories button{background:#252d49}
.categories button.active{background:#8b5cf6}
#status{color:#ddd;margin:15px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.card{background:#202943;border-radius:12px;overflow:hidden}
.preview{height:170px;background-color:#eee;background-image:linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccc 75%),linear-gradient(-45deg,transparent 75%,#ccc 75%);background-size:20px 20px;display:grid;place-items:center}
.preview img{max-width:100%;max-height:100%;object-fit:contain}
.info{padding:10px}
.name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px}
a{display:inline-block;text-decoration:none;color:white;background:#6844ce;padding:8px;border-radius:7px;font-size:12px;margin:2px}
#more{display:block;margin:25px auto}
footer{text-align:center;padding:25px;color:#aaa}
@media(max-width:500px){
.search{flex-direction:column}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.preview{height:140px}
}
</style>
</head>
<body>

<header>
<h1>🖼️ RYH PNG HUB</h1>
<p>Free PNG Search Website</p>
<form class="search" id="form">
<input id="q" placeholder="PNG खोजें जैसे Cut, Gaming, Flower..." required>
<button type="submit">SEARCH</button>
</form>
</header>

<main>
<h2>PNG Categories</h2>
<div class="categories" id="categories">
<button class="active" data-q="transparent png">All PNG</button>
<button data-q="youtube logo png">YouTube</button>
<button data-q="gaming png">Gaming</button>
<button data-q="flower png">Flowers</button>
<button data-q="cartoon png">Cartoon</button>
<button data-q="car png">Cars</button>
<button data-q="red scratch effect png">Cut PNG</button>
<button data-q="red scratch texture png">Red Scratch</button>
<button data-q="crack texture png">Crack Effect</button>
<button data-q="fire png">Fire</button>
<button data-q="nature png">Nature</button>
<button data-q="festival png">Festival</button>
</div>

<div id="status">कोई कैटेगरी चुनें या PNG सर्च करें।</div>
<div class="grid" id="results"></div>
<button id="more" hidden>और PNG दिखाओ</button>
</main>

<footer>© 2026 RYH PNG HUB</footer>

<script>
const form=document.getElementById("form");
const input=document.getElementById("q");
const results=document.getElementById("results");
const statusBox=document.getElementById("status");
const more=document.getElementById("more");

let current="";
let next=null;
let busy=false;

async function searchPNG(term,append=false){
 if(busy)return;
 if(!append){
  current=term;
  next=null;
  results.innerHTML="";
  more.hidden=true;
 }
 busy=true;
 statusBox.textContent="PNG खोजी जा रही हैं...";

 try{
  const params=new URLSearchParams({
   action:"query",
   generator:"search",
   gsrsearch:"filemime:image/png "+term,
   gsrnamespace:"6",
   gsrlimit:"30",
   prop:"imageinfo",
   iiprop:"url|mime",
   iiurlwidth:"500",
   format:"json",
   origin:"*"
  });

  if(append && next){
   Object.entries(next).forEach(([k,v])=>params.set(k,v));
  }

  const response=await fetch(
   "https://commons.wikimedia.org/w/api.php?"+params.toString()
  );

  if(!response.ok)throw new Error("API error");

  const data=await response.json();
  next=data.continue||null;

  const pages=Object.values(data.query?.pages||{});
  const pngs=pages.map(page=>{
   const info=page.imageinfo?.[0];
   if(!info || info.mime!=="image/png")return null;
   return {
    title:page.title.replace("File:",""),
    image:info.thumburl||info.url,
    original:info.url
   };
  }).filter(Boolean);

  if(!pngs.length && !append){
   statusBox.textContent="PNG नहीं मिली। दूसरा शब्द लिखकर खोजें।";
   more.hidden=true;
   return;
  }

  if(!pngs.length && append){
   statusBox.textContent="आगे कोई PNG नहीं मिली।";
   more.hidden=true;
   return;
  }

  pngs.forEach(item=>{
   const card=document.createElement("div");
   card.className="card";

   const preview=document.createElement("div");
   preview.className="preview";

   const img=document.createElement("img");
   img.loading="lazy";
   img.src=item.image;
   img.alt=item.title;
   preview.appendChild(img);

   const info=document.createElement("div");
   info.className="info";

   const name=document.createElement("div");
   name.className="name";
   name.textContent=item.title;

   const link=document.createElement("a");
   link.href=item.original;
   link.target="_blank";
   link.rel="noopener";
   link.textContent="Open PNG";

   info.append(name,link);
   card.append(preview,info);
   results.appendChild(card);
  });

  statusBox.textContent="कुल "+results.children.length+" PNG दिखाई गईं।";
  more.hidden=!next;

 }catch(error){
  statusBox.textContent="सर्च नहीं हो पाई। इंटरनेट या Wikimedia सेवा जाँचें और फिर कोशिश करें।";
  more.hidden=true;
 }finally{
  busy=false;
 }
}

form.addEventListener("submit",e=>{
 e.preventDefault();
 document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
 searchPNG(input.value.trim());
});

document.getElementById("categories").addEventListener("click",e=>{
 const btn=e.target.closest("button[data-q]");
 if(!btn)return;
 document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 input.value=btn.dataset.q;
 searchPNG(btn.dataset.q);
});

more.addEventListener("click",()=>{
 if(next)searchPNG(current,true);
});
</script>
</body>
</html>
