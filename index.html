
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RYH PNG HUB - Editing Materials</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101426;color:white;font-family:Arial}
header{text-align:center;padding:28px 14px;background:linear-gradient(130deg,#672acb,#151b3d)}
h1{margin:0;font-size:30px}
header p{color:#eee}
.search{display:flex;gap:8px;max-width:650px;margin:20px auto}
input{flex:1;min-width:0;padding:14px;border:0;border-radius:9px;font-size:16px}
button{padding:12px 15px;border:0;border-radius:8px;background:#8b5cf6;color:white;font-weight:bold;cursor:pointer}
main{max-width:1100px;margin:auto;padding:16px}
.categories{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.categories button{background:#28314c}
.categories button.active{background:#8b5cf6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.card{background:#202943;border-radius:12px;overflow:hidden}
.card img{width:100%;height:170px;object-fit:contain;background:#fff}
.info{padding:10px}
.name{font-size:13px;min-height:32px;overflow-wrap:anywhere}
.actions{display:flex;gap:6px;margin-top:9px}
.actions a{flex:1;text-align:center;text-decoration:none;color:white;background:#6844ce;padding:9px 5px;border-radius:7px;font-size:12px}
#status{color:#ddd;margin:16px 0}
@media(max-width:500px){.search{flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<h1>🖼️ RYH PNG HUB</h1>
<p>Free Editing Materials & PNG Search</p>
<form class="search" id="form">
<input id="query" placeholder="Search PNG: fire, smoke, cut..." required>
<button>SEARCH PNG</button>
</form>
</header>

<main>
<h2>Editing Materials</h2>
<div class="categories" id="categories">
<button data-q="red scratch png" class="active">Cut Effect</button>
<button data-q="fire transparent png">Fire PNG</button>
<button data-q="smoke transparent png">Smoke</button>
<button data-q="light effect png">Light Effect</button>
<button data-q="shadow transparent png">Shadow</button>
<button data-q="gaming logo png">Gaming</button>
<button data-q="youtube subscribe png">YouTube</button>
<button data-q="flower transparent png">Flowers</button>
<button data-q="car transparent png">Cars</button>
<button data-q="sticker transparent png">Stickers</button>
<button data-q="photo frame png">Frames</button>
<button data-q="cloud transparent png">Clouds</button>
</div>
<div id="status">PNG खोजने के लिए कैटेगरी चुनें।</div>
<div class="grid" id="results"></div>
</main>

<script>
const results=document.getElementById("results");
const statusBox=document.getElementById("status");
const query=document.getElementById("query");

async function searchPNG(term){
 results.innerHTML="";
 statusBox.textContent="PNG खोजी जा रही हैं...";

 try{
  const api="https://commons.wikimedia.org/w/api.php";
  const params=new URLSearchParams({
   action:"query",
   generator:"search",
   gsrsearch:term+" filemime:image/png",
   gsrnamespace:"6",
   gsrlimit:"40",
   prop:"imageinfo",
   iiprop:"url",
   iiurlwidth:"600",
   format:"json",
   origin:"*"
  });

  const response=await fetch(api+"?"+params);
  if(!response.ok)throw new Error("Network error");
  const data=await response.json();
  const pages=Object.values(data.query?.pages||{});

  if(!pages.length){
   statusBox.textContent="इस नाम से PNG नहीं मिली। दूसरा शब्द खोजें।";
   return;
  }

  pages.forEach(page=>{
   const info=page.imageinfo?.[0];
   if(!info)return;

   const card=document.createElement("div");
   card.className="card";

   const img=document.createElement("img");
   img.loading="lazy";
   img.src=info.thumburl||info.url;
   img.alt=page.title;

   const details=document.createElement("div");
   details.className="info";

   const name=document.createElement("div");
   name.className="name";
   name.textContent=page.title.replace("File:","");

   const actions=document.createElement("div");
   actions.className="actions";

   const open=document.createElement("a");
   open.href=info.url;
   open.target="_blank";
   open.rel="noopener";
   open.textContent="Open";

   const download=document.createElement("a");
   download.href=info.url;
   download.target="_blank";
   download.rel="noopener";
   download.textContent="Download";

   actions.append(open,download);
   details.append(name,actions);
   card.append(img,details);
   results.append(card);
  });

  statusBox.textContent=pages.length+" PNG results मिले। डाउनलोड से पहले लाइसेंस जाँचें।";
 }catch(error){
  statusBox.textContent="सर्च सेवा अभी काम नहीं कर रही। थोड़ी देर बाद कोशिश करें।";
 }
}

document.getElementById("form").addEventListener("submit",e=>{
 e.preventDefault();
 document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
 searchPNG(query.value.trim());
});

document.getElementById("categories").addEventListener("click",e=>{
 const btn=e.target.closest("button[data-q]");
 if(!btn)return;
 document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 query.value=btn.dataset.q;
 searchPNG(btn.dataset.q);
});

query.value="red scratch png";
searchPNG("red scratch png");
</script>
</body>
</html>
